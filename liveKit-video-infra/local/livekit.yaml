port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

redis:
  address: redis:6379

# Local development credentials only. Production secrets are supplied through
# protected server configuration and are never committed to source control.
keys:
  devkey: devsecret_devsecret_devsecret_devsecret

logging:
  level: info

webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3101/api/v1/livekit/webhooks
